<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blank space">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Blank space</title>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; background: #121216; overflow: hidden; color-scheme: dark; }
  html:fullscreen, html:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #121216;
  }
  html:fullscreen #view, html:-webkit-full-screen #view {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    touch-action: none;
  }
  :root {
    --edge: 12px;
    --chip: #1c1c22;
    --ink: #e4e4ea;
    --line: #3a3a44;
    --full-slot: 172px;
    --lift-slot: 60px;
  }
  #hud {
    position: fixed;
    z-index: 4;
    top: max(var(--edge), env(safe-area-inset-top));
    left: max(var(--edge), env(safe-area-inset-left));
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px;
    max-width: calc(100% - max(var(--edge), env(safe-area-inset-left)) - max(var(--edge), env(safe-area-inset-right)) - var(--full-slot));
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  #god,
  #mute,
  #full {
    box-sizing: border-box;
    min-height: 44px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    padding: 0 14px;
    background: var(--chip);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    font: 14px/1 ui-sans-serif, system-ui, sans-serif;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #mute,
  #full {
    appearance: none;
    -webkit-appearance: none;
  }
  #full {
    position: fixed;
    z-index: 4;
    top: max(var(--edge), env(safe-area-inset-top));
    right: max(var(--edge), env(safe-area-inset-right));
  }
  #god input {
    width: 18px;
    height: 18px;
    margin: 0;
    flex: 0 0 auto;
    accent-color: var(--ink);
  }
  #mute[aria-pressed="true"] { color: #c8c8d2; }
  #full:focus-visible,
  #mute:focus-visible,
  #god:focus-within {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  html:fullscreen #full,
  html:-webkit-full-screen #full { background: #2a2a34; }
  #hint {
    position: fixed;
    z-index: 3;
    left: max(var(--edge), env(safe-area-inset-left));
    bottom: max(var(--edge), env(safe-area-inset-bottom));
    max-width: calc(100% - max(var(--edge), env(safe-area-inset-left)) - max(var(--edge), env(safe-area-inset-right)) - var(--lift-slot));
    box-sizing: border-box;
    margin: 0;
    padding: 8px 12px;
    text-align: left;
    color: var(--ink);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    font: 13px/1.35 ui-sans-serif, system-ui, sans-serif;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #hint.gone { opacity: 0; }
  #readout {
    position: fixed;
    z-index: 3;
    top: calc(max(var(--edge), env(safe-area-inset-top)) + 56px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: calc(100% - max(var(--edge), env(safe-area-inset-left)) - max(var(--edge), env(safe-area-inset-right)) - 24px);
    pointer-events: none;
  }
  #nav,
  #note {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    padding: 6px 12px;
    background: var(--chip);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    font: 13px/1.2 ui-sans-serif, system-ui, sans-serif;
    white-space: nowrap;
  }
  #note {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    overflow: hidden;
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    transition: opacity 0.25s ease;
  }
  #note.show {
    opacity: 1;
    max-height: 36px;
    padding: 6px 12px;
    border-color: var(--line);
    background: var(--chip);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
  #compass {
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--line);
    border-radius: 50%;
    position: relative;
    flex: 0 0 auto;
  }
  #compass::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 1px;
    width: 2px;
    height: 6px;
    border-radius: 1px;
    background: var(--ink);
  }
  @media (max-width: 520px) {
    #readout { top: calc(max(var(--edge), env(safe-area-inset-top)) + 108px); }
  }
  @media (max-width: 720px), (max-height: 720px) {
    #hint { font-size: 12px; line-height: 1.3; padding: 6px 10px; }
    #god, #mute, #full, #nav, #note { padding: 0 12px; font-size: 13px; }
    #nav, #note, #note.show { padding: 6px 12px; }
  }
  #dot {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(228, 228, 234, 0.55);
    pointer-events: none;
    z-index: 2;
  }
  #stick {
    position: fixed;
    width: 96px;
    height: 96px;
    margin: -48px 0 0 -48px;
    border: 1px solid rgba(228, 228, 234, 0.45);
    border-radius: 50%;
    background: rgba(28, 28, 34, 0.35);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 3;
    display: none;
  }
  #stick i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
    border-radius: 50%;
    background: rgba(228, 228, 234, 0.55);
  }
  #lift {
    position: fixed;
    z-index: 4;
    right: max(var(--edge), env(safe-area-inset-right));
    bottom: max(var(--edge), env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #lift button {
    position: relative;
    box-sizing: border-box;
    width: 44px;
    height: 44px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--chip);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    padding: 0;
    touch-action: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  #lift button:focus,
  #lift button:focus-visible,
  #lift button:active {
    outline: none;
  }
  #lift button.held,
  #lift button:active { background: #2a2a34; }
  @media (hover: hover) {
    #god:hover, #mute:hover, #full:hover, #lift button:hover { background: #26262e; }
    #lift button.held:hover { background: #2a2a34; }
  }
  #lift button::before {
    content: "";
    position: absolute;
    left: 16px;
    width: 10px;
    height: 10px;
    border-left: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    pointer-events: none;
  }
  #up::before { top: 14px; transform: rotate(135deg); }
  #down::before { top: 18px; transform: rotate(-45deg); }
  #result {
    position: fixed;
    z-index: 1;
    top: calc(max(var(--edge), env(safe-area-inset-top)) + 100px);
    left: max(var(--edge), env(safe-area-inset-left));
    max-width: calc(100% - max(var(--edge), env(safe-area-inset-left)) - max(var(--edge), env(safe-area-inset-right)));
    color: #ddd;
    font: 12px/1.45 ui-monospace, monospace;
    white-space: pre-wrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="hud">
  <label id="god"><input id="godbox" type="checkbox" checked> God mode</label>
  <button id="mute" type="button" aria-pressed="false">Mute</button>
</div>
<button id="full" type="button">Full screen</button>
<canvas id="view" tabindex="0"></canvas>
<div id="dot" aria-hidden="true"></div>
<div id="stick"><i></i></div>
<div id="lift">
  <button type="button" id="up" aria-label="Up" tabindex="-1" draggable="false"></button>
  <button type="button" id="down" aria-label="Down" tabindex="-1" draggable="false"></button>
</div>
<div id="readout">
  <div id="nav">
    <span id="compass" aria-hidden="true"></span>
    <span id="where">N · Flying</span>
  </div>
  <div id="note" role="status"></div>
</div>
<div id="hint">Right mouse looks · WASD · You move the skeleton</div>
<div id="result"></div>
<script>
(function () {
  var canvas = document.getElementById("view");
  var hint = document.getElementById("hint");
  var fullBtn = document.getElementById("full");
  var result = document.getElementById("result");
  var gl = null;

  function grabGL() {
    var sets = [
      { antialias: true, alpha: false, depth: true },
      { antialias: false, alpha: false, depth: true },
      { antialias: false, alpha: true, depth: true }
    ];
    var i, ctx;
    for (i = 0; i < sets.length; i++) {
      ctx = canvas.getContext("webgl", sets[i]) || canvas.getContext("experimental-webgl", sets[i]);
      if (ctx) return ctx;
    }
    return null;
  }

  function waitGL(left) {
    gl = grabGL();
    if (gl) {
      startGame();
      return;
    }
    if (left <= 0) {
      result.textContent = "This chat view cannot draw the space.";
      return;
    }
    requestAnimationFrame(function () { waitGL(left - 1); });
  }
  waitGL(90);

  function startGame() {
  var SPEED = 9;
  var FAST = 27;
  var TURN = 4.2;
  var LOOK = 0.006;
  var R = 16;
  var EYE = 1.7;
  var GRAV = 22;
  var JUMP = 8;
  var yaw = 0;
  var pitch = 0;
  var px = 0, py = R + EYE, pz = 0;
  var sound = {
    ctx: null,
    master: null,
    noise: null,
    flyG: null,
    flyF: null,
    unlocked: false,
    muted: false,
    dead: false,
    stepAcc: 0,
    stepArmed: false,
    stepN: 0,
    stepGains: [],
    prevX: px,
    prevY: py,
    prevZ: pz
  };
  var fx = 0, fy = 0, fz = -1;
  var god = true;
  var vr = 0;
  var keys = Object.create(null);
  var pointers = Object.create(null);
  var stickF = 0;
  var stickS = 0;
  var holdUp = false;
  var holdDown = false;
  var stick = document.getElementById("stick");
  var nub = stick.firstChild;

  function basis(y) {
    return {
      fx: -Math.sin(y),
      fz: -Math.cos(y),
      rx: Math.cos(y),
      rz: -Math.sin(y)
    };
  }

  function step(inp, dt, sprint) {
    var b = basis(yaw);
    var speed = sprint ? FAST : SPEED;
    px += (b.fx * inp.f + b.rx * inp.s) * speed * dt;
    pz += (b.fz * inp.f + b.rz * inp.s) * speed * dt;
    py += inp.u * speed * dt;
  }

  function plantForward() {
    var dist = Math.hypot(px, py, pz);
    if (dist < 1e-4) {
      px = 0; py = R + EYE; pz = 0;
      dist = R + EYE;
    }
    var nx = px / dist, ny = py / dist, nz = pz / dist;
    var d = fx * nx + fy * ny + fz * nz;
    fx -= nx * d; fy -= ny * d; fz -= nz * d;
    var fl = Math.hypot(fx, fy, fz);
    if (fl < 1e-5) {
      fx = 0; fy = 0; fz = -1;
      d = fx * nx + fy * ny + fz * nz;
      fx -= nx * d; fy -= ny * d; fz -= nz * d;
      fl = Math.hypot(fx, fy, fz);
      if (fl < 1e-5) {
        fx = -1; fy = 0; fz = 0;
        d = fx * nx + fy * ny + fz * nz;
        fx -= nx * d; fy -= ny * d; fz -= nz * d;
        fl = Math.hypot(fx, fy, fz);
      }
    }
    fx /= fl; fy /= fl; fz /= fl;
    return {
      nx: nx, ny: ny, nz: nz, dist: dist,
      rx: fy * nz - fz * ny,
      ry: fz * nx - fx * nz,
      rz: fx * ny - fy * nx
    };
  }

  function turnBy(angle) {
    if (!angle) return;
    var b = plantForward();
    var c = Math.cos(angle), s = Math.sin(angle);
    fx = fx * c - b.rx * s;
    fy = fy * c - b.ry * s;
    fz = fz * c - b.rz * s;
  }

  function adoptWorldYaw() {
    yaw = Math.atan2(-fx, -fz);
  }

  function adoptSurfaceForward() {
    fx = -Math.sin(yaw);
    fy = 0;
    fz = -Math.cos(yaw);
    plantForward();
  }

  function walkMove(inp, dt, sprint, jump) {
    var b = plantForward();
    var ground = R + EYE;
    var wasGrounded = b.dist <= ground + 0.05;
    var speed = sprint ? FAST : SPEED;
    px += (fx * inp.f + b.rx * inp.s) * speed * dt;
    py += (fy * inp.f + b.ry * inp.s) * speed * dt;
    pz += (fz * inp.f + b.rz * inp.s) * speed * dt;
    var dist = Math.hypot(px, py, pz);
    if (dist < 1e-4) dist = ground;
    var nx = px / dist, ny = py / dist, nz = pz / dist;
    if (jump && wasGrounded) {
      vr = JUMP;
      playJump();
    }
    if (wasGrounded && vr <= 0 && !jump) {
      dist = ground;
      vr = 0;
    } else {
      dist += vr * dt;
      vr -= GRAV * dt;
      if (dist < ground) {
        dist = ground;
        if (vr < 0) vr = 0;
      }
    }
    px = nx * dist; py = ny * dist; pz = nz * dist;
    plantForward();
  }

  function lookBy(dx, dy) {
    if (god) yaw -= dx * LOOK;
    else turnBy(-dx * LOOK);
    pitch -= dy * LOOK;
    var limit = Math.PI / 2 - 0.02;
    if (pitch > limit) pitch = limit;
    if (pitch < -limit) pitch = -limit;
  }

  if (location.hash === "#selftest") {
    var lines = [];
    function check(label, setYaw, inp, ex, ey, ez) {
      yaw = setYaw;
      pitch = 0;
      px = 0; py = 1.7; pz = 0;
      step(inp, 1, false);
      var dx = px, dy = py - 1.7, dz = pz;
      var len = Math.hypot(dx, dy, dz);
      var along = len < 1e-6 ? 0 : (dx * ex + dy * ey + dz * ez) / (len * Math.hypot(ex, ey, ez));
      var ok = len > 0.5 && along > 0.9;
      lines.push((ok ? "ok " : "FAIL ") + label + " cos=" + along.toFixed(3));
      return ok;
    }
    var pass = true;
    pass = check("W looks -z", 0, { f: 1, s: 0, u: 0 }, 0, 0, -1) && pass;
    pass = check("D moves +x", 0, { f: 0, s: 1, u: 0 }, 1, 0, 0) && pass;
    pass = check("A moves -x", 0, { f: 0, s: -1, u: 0 }, -1, 0, 0) && pass;
    pass = check("S moves +z", 0, { f: -1, s: 0, u: 0 }, 0, 0, 1) && pass;
    pass = check("W after yaw +90 faces -x", Math.PI / 2, { f: 1, s: 0, u: 0 }, -1, 0, 0) && pass;
    pass = check("D after yaw +90 moves -z", Math.PI / 2, { f: 0, s: 1, u: 0 }, 0, 0, -1) && pass;
    pass = check("Space moves +y", 0, { f: 0, s: 0, u: 1 }, 0, 1, 0) && pass;
    pass = check("C moves -y", 0, { f: 0, s: 0, u: -1 }, 0, -1, 0) && pass;
    yaw = 0; pitch = 0; px = 0; py = 1.7; pz = 8;
    result.textContent = (pass ? "PASS" : "FAIL") + "\n" + lines.join("\n");
  }

  var program, locPos, locMVP, locColor, buf, bodyBuf;
  var tprog, tLocA, tLocB, tLocSide, tLocMVP, tLocColor, tLocRes, tLocWidth, tbuf;
  var glLost = false;
  function compile(type, src) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    return shader;
  }
  function mountGL() {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER,
      "attribute vec3 aPos; uniform mat4 uMVP; uniform float uFogK; varying float vFog;" +
      "void main(){ vec4 p = uMVP * vec4(aPos, 1.0); gl_Position = p; vFog = clamp((p.w - 12.0) * uFogK, 0.0, 1.0); }"));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER,
      "precision mediump float; varying float vFog; uniform vec3 uColor;" +
      "void main(){ gl_FragColor = vec4(mix(uColor, vec3(0.071,0.071,0.086), vFog), 1.0); }"));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      result.textContent = "This chat view cannot draw the space.";
      return false;
    }
    gl.useProgram(program);
    locPos = gl.getAttribLocation(program, "aPos");
    locMVP = gl.getUniformLocation(program, "uMVP");
    locColor = gl.getUniformLocation(program, "uColor");
    locFogK = gl.getUniformLocation(program, "uFogK");
    buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(locPos);
    gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);
    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.071, 0.071, 0.086, 1);
    bodyBuf = gl.createBuffer();
    tprog = gl.createProgram();
    gl.attachShader(tprog, compile(gl.VERTEX_SHADER,
      "attribute vec3 aA; attribute vec3 aB; attribute vec2 aSide;" +
      "uniform mat4 uMVP; uniform vec2 uRes; uniform float uWidth; varying float vFog;" +
      "void main(){" +
      "  vec4 pa = uMVP * vec4(aA, 1.0); vec4 pb = uMVP * vec4(aB, 1.0);" +
      "  vec2 p0 = pa.xy / pa.w; vec2 p1 = pb.xy / pb.w;" +
      "  vec2 dpx = (p1 - p0) * uRes * 0.5;" +
      "  vec2 n = normalize(vec2(-dpx.y, dpx.x) + vec2(0.0001, 0.0002));" +
      "  vec2 off = n * (aSide.x * uWidth * 0.5) / (uRes * 0.5);" +
      "  vec4 p = mix(pa, pb, aSide.y);" +
      "  gl_Position = vec4((p.xy / p.w + off) * p.w, p.z, p.w);" +
      "  vFog = clamp((p.w - 12.0) / 58.0, 0.0, 1.0); }"));
    gl.attachShader(tprog, compile(gl.FRAGMENT_SHADER,
      "precision mediump float; varying float vFog; uniform vec3 uColor;" +
      "void main(){ gl_FragColor = vec4(mix(uColor, vec3(0.071,0.071,0.086), vFog), 1.0); }"));
    gl.linkProgram(tprog);
    if (gl.getProgramParameter(tprog, gl.LINK_STATUS)) {
      tLocA = gl.getAttribLocation(tprog, "aA");
      tLocB = gl.getAttribLocation(tprog, "aB");
      tLocSide = gl.getAttribLocation(tprog, "aSide");
      tLocMVP = gl.getUniformLocation(tprog, "uMVP");
      tLocColor = gl.getUniformLocation(tprog, "uColor");
      tLocRes = gl.getUniformLocation(tprog, "uRes");
      tLocWidth = gl.getUniformLocation(tprog, "uWidth");
      tbuf = gl.createBuffer();
    }
    return true;
  }

  var verts = [];
  var meridians = 24;
  var parallels = 12;
  var steps = 48;
  var m, s, p, a, t0, t1, ca, sa;
  for (m = 0; m < meridians; m++) {
    a = m / meridians * Math.PI * 2;
    ca = Math.cos(a); sa = Math.sin(a);
    for (s = 0; s < steps; s++) {
      t0 = s / steps * Math.PI;
      t1 = (s + 1) / steps * Math.PI;
      verts.push(
        Math.sin(t0) * ca * R, Math.cos(t0) * R, Math.sin(t0) * sa * R,
        Math.sin(t1) * ca * R, Math.cos(t1) * R, Math.sin(t1) * sa * R
      );
    }
  }
  for (p = 1; p < parallels; p++) {
    t0 = p / parallels * Math.PI;
    var yy = Math.cos(t0) * R;
    var rad = Math.sin(t0) * R;
    for (s = 0; s < steps; s++) {
      var a0 = s / steps * Math.PI * 2;
      var a1 = (s + 1) / steps * Math.PI * 2;
      verts.push(
        Math.cos(a0) * rad, yy, Math.sin(a0) * rad,
        Math.cos(a1) * rad, yy, Math.sin(a1) * rad
      );
    }
  }

  // Cycles use raised cosines so joints ease through each phase.
  // The lower foot is planted on the ground so a bent knee drops the hips.
  var animT = 0;
  var gaitPhase = 0;
  var gaitLive = false;
  var wasAir = false;
  var landHold = 0;
  var airTime = 0;

  function poseSet(name, rx, ry, rz) {

    j.ry = ry;
    j.rz = rz;

  function poseBlend(name, rx, ry, rz, k) {

  function damp(cur, target, dt, rate) {

  function settleFeet(lift) {

    if (dx < -0.1) dx = -0.1;

  function bendSpine(rxL, rxT, rxC, ryL, ryT, rz) {

      neck = Math.pow(Math.sin(t * Math.PI * 0.5), 1.35);
      mid = Math.sin(t * Math.PI);

      if (modeMix >= 1) modeFrom = null;
    }
    if (!god && grounded) settleFeet(0);
    if (sound) sound.stepHz = stepHz;
  }


  var whereEl = document.getElementById("where");
  var compassEl = document.getElementById("compass");
  var noteEl = document.getElementById("note");
  var noteLeft = 0;
  var whereText = whereEl ? whereEl.textContent : "";
  var compassDeg = 0;
  function say(text) {
    if (!noteEl) return;
    noteEl.textContent = text;
    noteEl.classList.add("show");
    noteLeft = 1.5;
  }
  function paintReadout(inp, dt) {
    if (noteLeft > 0) {
      noteLeft -= dt;
      if (noteLeft <= 0) noteEl.classList.remove("show");
    }
    var hx, hz, b;
    if (god) {
      b = basis(yaw);
      hx = b.fx;
      hz = b.fz;
    } else {
      hx = fx;
      hz = fz;
    }
    var deg = Math.atan2(hx, -hz) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    var names = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    var name = names[Math.round(deg / 45) % 8];
    var dist = Math.hypot(px, py, pz);
    var grounded = dist <= R + EYE + 0.08 && vr <= 0.05;
    var mode = "Standing";
    if (god) mode = "Flying";
    else if (!grounded) mode = vr > 0.05 ? "Jumping" : "Falling";
    else if (inp && Math.hypot(inp.f, inp.s) > 0.04) mode = "Walking";
    var line = name + " · " + mode;
    if (whereEl && line !== whereText) {
      whereText = line;
      whereEl.textContent = line;
    }
    var shown = Math.round(deg);
    if (compassEl && shown !== compassDeg) {
      compassDeg = shown;
      compassEl.style.transform = "rotate(" + shown + "deg)";
    }
  }

  var last = performance.now();
  var jumpPrev = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (glLost || gl.isContextLost()) return;
    if (!fit()) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var inp = keyboardMove(dt);
    var jumpNow = !!(keys.Space || holdUp);
    var jumpEdge = jumpNow && !jumpPrev;
    jumpPrev = jumpNow;
    var sprint = !!(keys.ShiftLeft || keys.ShiftRight);
    if (god) {
      if (inp.f || inp.s || inp.u) step(inp, dt, sprint);
    } else {
      walkMove({ f: inp.f, s: inp.s, u: 0 }, dt, sprint, jumpEdge);
    }
    mixMotion(inp, dt, sprint);
    poseSkeleton(dt, inp, sprint);
    paintReadout(inp, dt);
    cameraView();
    multiply(proj, view, mvp);
    gl.useProgram(program);
    gl.enableVertexAttribArray(locPos);
    gl.enable(gl.DEPTH_TEST);
    gl.uniformMatrix4fv(locMVP, false, mvp);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);
    gl.uniform3f(locColor, 0.55, 0.56, 0.64);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniform1f(locFogK, 1 / 58);
    gl.drawArrays(gl.LINES, 0, starStart);
    gl.uniform1f(locFogK, 0);
    gl.uniform3f(locColor, 0.62, 0.63, 0.72);
    gl.drawArrays(gl.LINES, starStart, verts.length / 3 - starStart);
    gl.uniform1f(locFogK, 1 / 58);
    var posed = bodyFrame();
    var skel = [];
    for (var si = 0; si < boneNames.length; si++) {
      var child = jointLocal(boneNames[si]);
      var parent = jointLocal(joints[boneNames[si]].parent);
      skel.push(parent[0], parent[1], parent[2], child[0], child[1], child[2]);
    }
    var bodyWorld = new Float32Array(skel.length);
    for (var bi = 0; bi < skel.length; bi += 3) {
      var lx = skel[bi], ly = skel[bi + 1], lz = skel[bi + 2];
      bodyWorld[bi] = px - posed.ux * EYE + posed.rx * lx + posed.ux * ly - posed.fx * lz;
      bodyWorld[bi + 1] = py - posed.uy * EYE + posed.ry * lx + posed.uy * ly - posed.fy * lz;
      bodyWorld[bi + 2] = pz - posed.uz * EYE + posed.rz * lx + posed.uz * ly - posed.fz * lz;
    }
    if (tprog) {
      var segs = bodyWorld.length / 6;
      var quads = new Float32Array(segs * 48);
      var qi = 0, gi;
      for (gi = 0; gi < segs; gi++) {
        var ax = bodyWorld[gi * 6], ay = bodyWorld[gi * 6 + 1], az = bodyWorld[gi * 6 + 2];
        var bx = bodyWorld[gi * 6 + 3], by = bodyWorld[gi * 6 + 4], bz = bodyWorld[gi * 6 + 5];
        var push = function(side, end) {
          quads[qi++] = ax; quads[qi++] = ay; quads[qi++] = az;
          quads[qi++] = bx; quads[qi++] = by; quads[qi++] = bz;
          quads[qi++] = side; quads[qi++] = end;
        };
        push(1, 0); push(1, 1); push(-1, 0);
        push(1, 1); push(-1, 1); push(-1, 0);
      }
      gl.useProgram(tprog);
      gl.bindBuffer(gl.ARRAY_BUFFER, tbuf);
      gl.bufferData(gl.ARRAY_BUFFER, quads, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(tLocA);
      gl.enableVertexAttribArray(tLocB);
      gl.enableVertexAttribArray(tLocSide);
      gl.vertexAttribPointer(tLocA, 3, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(tLocB, 3, gl.FLOAT, false, 32, 12);
      gl.vertexAttribPointer(tLocSide, 2, gl.FLOAT, false, 32, 24);
      gl.uniformMatrix4fv(tLocMVP, false, mvp);
      gl.uniform2f(tLocRes, canvas.width, canvas.height);
      gl.uniform1f(tLocWidth, Math.max(2, canvas.width / 480));
      gl.uniform3f(tLocColor, 0.93, 0.94, 0.97);
      gl.drawArrays(gl.TRIANGLES, 0, quads.length / 8);
      gl.disableVertexAttribArray(tLocA);
      gl.disableVertexAttribArray(tLocB);
      gl.disableVertexAttribArray(tLocSide);
    } else {
      gl.bindBuffer(gl.ARRAY_BUFFER, bodyBuf);
      gl.bufferData(gl.ARRAY_BUFFER, bodyWorld, gl.DYNAMIC_DRAW);
      gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);
      gl.uniform3f(locColor, 0.93, 0.94, 0.97);
      gl.drawArrays(gl.LINES, 0, bodyWorld.length / 3);
    }
  }
  requestAnimationFrame(frame);
  }
})();
</script>
</body>
